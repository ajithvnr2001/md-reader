name = "md-reader-r2"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ---------------------------------------------------------
# R2 bucket binding — replace bucket_name with your bucket
# Create it first with:  wrangler r2 bucket create my-md-docs
# ---------------------------------------------------------
[[r2_buckets]]
binding = "MD_BUCKET"
bucket_name = "my-md-docs"

# ---------------------------------------------------------
# Bundle static frontend files (html/css/js) as raw text
# so index.js can `import` and serve them directly.
# ---------------------------------------------------------
[[rules]]
type = "Text"
globs = ["public/**/*.txt"]
fallthrough = true

# ---------------------------------------------------------
# Secrets (set via `npx wrangler secret put <NAME>` — NEVER commit keys):
#   GEMINI_API_KEY      - required for all Gemini 3.5 features + TTS podcasts
#   INCEPTION_API_KEY   - required for Mercury 2 model
#   UPLOAD_SECRET       - required when REQUIRE_AUTH = "true"
# ---------------------------------------------------------
[vars]
# Set to "true" to require the X-Auth-Key header on write/cache endpoints
REQUIRE_AUTH = "false"
